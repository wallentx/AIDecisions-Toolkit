name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  statuses: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n $unformatted ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Python example
        run: python -m unittest discover -s tools/diff/python/tests -v

      - name: Build and verify native executables
        run: go run ./cmd/aid-build

      - name: Package native executables
        run: python .github/scripts/package.py

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  minimum-go:
    name: Minimum Go version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Test on minimum Go version
        env:
          CGO_ENABLED: '0'
        run: go test ./...
