name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require tag and source version to match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/verify-version.py --tag "$RELEASE_TAG"

  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Prepare source archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="AIDecisions-Toolkit-$RELEASE_TAG/" --output="release-assets/AIDecisions-Toolkit-$RELEASE_TAG-source.tar.gz" HEAD
          cd release-assets
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "AIDecisions-Toolkit $RELEASE_TAG" --notes-file docs/releases/"$RELEASE_TAG".md
