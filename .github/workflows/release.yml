name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Exact release tag to build, for example v0.2.0. Leave blank to use bump.
        required: false
        type: string
      bump:
        description: Version bump calculated by actions-toolbox when version is blank.
        required: false
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - patch-prerelease
          - minor-prerelease
          - major-prerelease

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  statuses: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_target: ${{ steps.resolve.outputs.release_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PRERELEASE_TYPE: rc.
        with:
          checkout: false

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          INPUT_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'none' }}
        run: |
          set -euo pipefail

          compute_semver_bump() {
            local bump_kind=$1
            local latest=${GH_LATEST_TAG:-v0.0.0}
            local tag_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?(\+[0-9A-Za-z.-]+)?$'
            local major=0 minor=0 patch=0 prerelease=""
            if [[ $latest =~ $tag_re ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}
              prerelease=${BASH_REMATCH[5]:-}
            fi

            local next_major="$((major + 1)).0.0"
            local next_minor="${major}.$((minor + 1)).0"
            local next_patch="${major}.${minor}.$((patch + 1))"
            if [[ -n $prerelease ]]; then
              (( minor == 0 && patch == 0 )) && next_major="${major}.0.0"
              (( patch == 0 )) && next_minor="${major}.${minor}.0"
              next_patch="${major}.${minor}.${patch}"
            fi

            local base_ver=""
            case $bump_kind in
              major) printf 'v%s\n' "$next_major"; return 0 ;;
              minor) printf 'v%s\n' "$next_minor"; return 0 ;;
              patch) printf 'v%s\n' "$next_patch"; return 0 ;;
              major-prerelease) base_ver=$next_major ;;
              minor-prerelease) base_ver=$next_minor ;;
              patch-prerelease) base_ver=$next_patch ;;
            esac

            local max_rc=0 tag suffix
            while IFS= read -r tag; do
              suffix=${tag#"v${base_ver}-rc"}
              suffix=${suffix#.}
              suffix=${suffix%%+*}
              if [[ $suffix =~ ^[0-9]+$ ]] && (( 10#$suffix > max_rc )); then
                max_rc=$((10#$suffix))
              fi
            done < <(git tag --list "v${base_ver}-rc*" 2>/dev/null || true)

            printf 'v%s-rc.%d\n' "$base_ver" "$((max_rc + 1))"
          }

          if [[ $GITHUB_EVENT_NAME == "release" ]]; then
            release_tag=$EVENT_RELEASE_TAG
            checkout_ref=$release_tag
            release_target=$release_tag
          elif [[ -n ${INPUT_VERSION:-} ]]; then
            release_tag=$INPUT_VERSION
            [[ $release_tag == v* ]] || release_tag="v${release_tag}"
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              checkout_ref=$release_tag
              release_target=$release_tag
            else
              checkout_ref=$GITHUB_SHA
              release_target=$GITHUB_SHA
            fi
          else
            case ${INPUT_BUMP:-none} in
              none)
                printf 'Provide either an exact version tag or choose a version bump (patch, minor, major).\n' >&2
                exit 1
                ;;
              major) release_tag=${GH_NEXT_MAJOR:-$(compute_semver_bump major)} ;;
              minor) release_tag=${GH_NEXT_MINOR:-$(compute_semver_bump minor)} ;;
              patch) release_tag=${GH_NEXT_PATCH:-$(compute_semver_bump patch)} ;;
              major-prerelease) release_tag=${GH_NEXT_MAJOR_PRERELEASE:-$(compute_semver_bump major-prerelease)} ;;
              minor-prerelease) release_tag=${GH_NEXT_MINOR_PRERELEASE:-$(compute_semver_bump minor-prerelease)} ;;
              patch-prerelease) release_tag=${GH_NEXT_PATCH_PRERELEASE:-$(compute_semver_bump patch-prerelease)} ;;
              *)
                printf 'Unknown bump value: %s\n' "${INPUT_BUMP:-}" >&2
                exit 1
                ;;
            esac
            [[ $release_tag == v* ]] || release_tag="v${release_tag}"
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              checkout_ref=$release_tag
              release_target=$release_tag
            else
              checkout_ref=$GITHUB_SHA
              release_target=$GITHUB_SHA
            fi
          fi

          if [[ -z $release_tag ]]; then
            printf 'Release tag resolved to an empty value\n' >&2
            exit 1
          fi

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! $release_tag =~ $semver_re ]]; then
            printf 'Release tag must look like vMAJOR.MINOR.PATCH (with optional SemVer prerelease/build metadata): %s\n' "$release_tag" >&2
            exit 1
          fi

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'checkout_ref=%s\n' "$checkout_ref"
            printf 'release_target=%s\n' "$release_target"
          } >> "$GITHUB_OUTPUT"

          printf 'Resolved release tag: %s\nCheckout ref: %s\nRelease target: %s\n' \
            "$release_tag" "$checkout_ref" "$release_target"

  gate:
    name: Release gate
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AID_RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      AID_CHECKOUT_REF: ${{ needs.resolve-release.outputs.checkout_ref }}
      CGO_ENABLED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.AID_CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Verify formatting, tests, vet, and Python example
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n $unformatted ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go test ./...
          go vet ./...
          python -m unittest discover -s tools/diff/python/tests -v

  minimum-go:
    name: Minimum Go gate
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AID_CHECKOUT_REF: ${{ needs.resolve-release.outputs.checkout_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.AID_CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Test on minimum Go version
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    name: Build (${{ matrix.os }})
    needs:
      - resolve-release
      - gate
      - minimum-go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      deployments: read
      discussions: read
      id-token: write
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      AID_RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      AID_CHECKOUT_REF: ${{ needs.resolve-release.outputs.checkout_ref }}
      CGO_ENABLED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.AID_CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Test, build, and package native executables
        env:
          RELEASE_TAG: ${{ env.AID_RELEASE_TAG }}
        run: |
          set -euo pipefail
          go test ./...
          go run ./cmd/aid-build
          python .github/scripts/package.py

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/packages/*.zip'

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ env.AID_RELEASE_TAG }}-${{ matrix.os }}
          path: dist/packages/*.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AID_RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      AID_CHECKOUT_REF: ${{ needs.resolve-release.outputs.checkout_ref }}
      AID_RELEASE_TARGET: ${{ needs.resolve-release.outputs.release_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.AID_CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: true

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: native-${{ env.AID_RELEASE_TAG }}-*
          merge-multiple: true

      - name: Prepare source archive and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release-assets/*.zip)
          if (( ${#zips[@]} == 0 )); then
            printf 'No native release archives were downloaded\n' >&2
            exit 1
          fi
          tmp_version_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_version_dir"' EXIT
          printf '%s\n' "${AID_RELEASE_TAG#v}" > "${tmp_version_dir}/VERSION"
          git archive --format=tar.gz \
            --prefix="AIDecisions-Toolkit-${AID_RELEASE_TAG}/" \
            --add-file="${tmp_version_dir}/VERSION" \
            --output="release-assets/AIDecisions-Toolkit-${AID_RELEASE_TAG}-source.tar.gz" \
            HEAD
          (
            cd release-assets
            sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Publish or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.tar.gz release-assets/SHA256SUMS)
          head_sha="$(git rev-parse HEAD)"
          git fetch --tags --force --quiet origin
          if git rev-parse -q --verify "refs/tags/${AID_RELEASE_TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "refs/tags/${AID_RELEASE_TAG}")"
            if [[ $tag_sha != "$head_sha" ]]; then
              printf 'Tag %s points to %s rather than built commit %s; refusing to overwrite release assets.\n' \
                "$AID_RELEASE_TAG" "$tag_sha" "$head_sha" >&2
              exit 1
            fi
          fi

          if gh release view "$AID_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$AID_RELEASE_TAG" "${assets[@]}" --clobber
          elif [[ $GITHUB_EVENT_NAME == "workflow_dispatch" ]]; then
            args=(
              "$AID_RELEASE_TAG"
              "${assets[@]}"
              --target "$AID_RELEASE_TARGET"
              --title "AIDecisions-Toolkit $AID_RELEASE_TAG"
            )
            notes_file="docs/releases/${AID_RELEASE_TAG}.md"
            if [[ -f $notes_file ]]; then
              args+=(--notes-file "$notes_file")
            else
              args+=(--generate-notes)
            fi
            tag_without_build=${AID_RELEASE_TAG%%+*}
            if [[ $tag_without_build == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          else
            printf 'Release %s does not exist for %s event\n' "$AID_RELEASE_TAG" "$GITHUB_EVENT_NAME" >&2
            exit 1
          fi
