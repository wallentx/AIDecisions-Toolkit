<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 934" width="488" height="934" role="img" aria-label="Comparison between ad-hoc LLM API calls and AIDecisions-Toolkit">
  <defs>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e05c5c"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4d9bef"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#37b47e"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="488" height="934" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- The examples stack vertically so each fills the README width. -->
  <g id="without-aid">
  <rect x="18" y="18" width="452" height="440" rx="10" fill="#161b22" stroke="#6e2c32" stroke-width="1.25"/>
  <rect x="18" y="18" width="452" height="42" rx="10" fill="#2d1619"/>
  <rect x="18" y="48" width="452" height="12" fill="#2d1619"/>
  <line x1="18" y1="60" x2="470" y2="60" stroke="#6e2c32" stroke-width="1"/>

  <circle cx="38" cy="39" r="5.5" fill="#e05c5c"/>
  <text x="52" y="43" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="12" font-weight="700" fill="#e05c5c">WITHOUT AID</text>
  <text x="454" y="43" text-anchor="end" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#8b949e">Improvised multi-call agent loop</text>

  <!-- User prompt box (Without) -->
  <rect x="36" y="76" width="416" height="44" rx="7" fill="#1c232d" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="94" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="600" fill="#8b949e">USER ASK</text>
  <text x="50" y="111" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#e6edf3">&quot;Is PR #42 ready, and does my staged diff break the API?&quot;</text>

  <line x1="244" y1="120" x2="244" y2="140" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow-bad)"/>

  <!-- Noisy command stack -->
  <rect x="36" y="144" width="416" height="28" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="48" y="162" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh pr view 42 --json files,reviews,statusCheckRollup</text>

  <rect x="36" y="178" width="416" height="28" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="48" y="196" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh api .../pulls/42/comments --paginate</text>

  <rect x="36" y="212" width="416" height="28" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="48" y="230" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh api graphql -f query=&apos;...reviewThreads...&apos;</text>

  <rect x="36" y="246" width="416" height="28" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="48" y="264" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh run view 918273 --log-failed</text>
  <text x="440" y="264" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10" fill="#7d8fa1"># megabytes</text>

  <rect x="36" y="280" width="416" height="28" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="48" y="298" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>git diff --cached</text>
  <text x="440" y="298" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10" fill="#7d8fa1"># raw prompt text</text>

  <line x1="244" y1="308" x2="244" y2="328" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow-bad)"/>

  <!-- Context bloat box -->
  <rect x="36" y="332" width="416" height="52" rx="7" fill="#1c232d" stroke="#6e2c32" stroke-width="1"/>
  <text x="50" y="352" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="700" fill="#e6edf3">Agent parses raw responses across extra LLM turns</text>
  <text x="50" y="371" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#8b949e">Unbounded JSON &amp; logs crowd context; prose guesses replace probabilities</text>

  <!-- Bottom cost badge (Without) -->
  <rect x="36" y="398" width="416" height="44" rx="7" fill="#2d1619" stroke="#6e2c32" stroke-width="1"/>
  <text x="244" y="417" text-anchor="middle" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#e05c5c">8-12 SHELL &amp; API CALLS  ·  HIGH CONTEXT BURN</text>
  <text x="244" y="433" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#8b949e">Repeated parsing work, missed pages, and uncalibrated text judgment</text>


  </g>

  <g id="with-aid" transform="translate(-472 458)">
  <rect x="490" y="18" width="452" height="440" rx="10" fill="#161b22" stroke="#215c43" stroke-width="1.25"/>
  <rect x="490" y="18" width="452" height="42" rx="10" fill="#102920"/>
  <rect x="490" y="48" width="452" height="12" fill="#102920"/>
  <line x1="490" y1="60" x2="942" y2="60" stroke="#215c43" stroke-width="1"/>

  <circle cx="510" cy="39" r="5.5" fill="#37b47e"/>
  <text x="524" y="43" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="12" font-weight="700" fill="#37b47e">WITH AIDECISIONS-TOOLKIT</text>
  <text x="926" y="43" text-anchor="end" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#8b949e">Agent skills + single-pass Decisions</text>

  <!-- User prompt box (With) -->
  <rect x="508" y="76" width="416" height="44" rx="7" fill="#1c232d" stroke="#30363d" stroke-width="1"/>
  <text x="522" y="94" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="600" fill="#8b949e">SAME USER ASK</text>
  <text x="522" y="111" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#e6edf3">&quot;Is PR #42 ready, and does my staged diff break the API?&quot;</text>

  <line x1="716" y1="120" x2="716" y2="138" stroke="#4d9bef" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Installed Agent Skills + MCP routing bar (single flowed <text> with <tspan>s) -->
  <rect x="508" y="142" width="416" height="46" rx="7" fill="#132338" stroke="#264f78" stroke-width="1"/>
  <text x="522" y="161" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#e6edf3"><tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#4d9bef">AID --init</tspan> installs <tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#e8944a">SKILL.md</tspan> + <tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#4d9bef">AID --mcp</tspan> into your agent</text>
  <text x="522" y="179" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#8b949e">Claude Code · Codex · Cursor · Gemini CLI · Antigravity · OpenCode · Copilot</text>

  <!-- Split wires to the 2 bounded operations -->
  <line x1="609" y1="188" x2="609" y2="208" stroke="#4d9bef" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="823" y1="188" x2="823" y2="208" stroke="#4d9bef" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Sub-card 1: Bounded Evidence Collectors -->
  <rect x="508" y="212" width="202" height="166" rx="7" fill="#1c232d" stroke="#30363d" stroke-width="1"/>
  <text x="520" y="231" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700" fill="#4d9bef">1. BOUNDED EVIDENCE</text>

  <rect x="518" y="240" width="182" height="26" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="527" y="257" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>AID.pr .../pull/42 --json</text>

  <text x="520" y="284" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#e6edf3">• Paginated threads &amp; checks</text>
  <text x="520" y="301" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#e6edf3">• Head-drift &amp; completeness</text>
  <text x="520" y="318" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#e6edf3">• Strict byte caps enforced</text>
  <text x="520" y="340" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#8b949e">Also: AID.pr-delta, AID.ci,</text>
  <text x="520" y="354" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#8b949e">AID.review-queue, AID.runtime</text>

  <!-- Sub-card 2: Single-Pass Decisions API -->
  <rect x="722" y="212" width="202" height="166" rx="7" fill="#1c232d" stroke="#30363d" stroke-width="1"/>
  <text x="734" y="231" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700" fill="#37b47e">2. DECISIONS API</text>

  <rect x="732" y="240" width="182" height="26" rx="5" fill="#0a0e13" stroke="#2a333e" stroke-width="1"/>
  <text x="741" y="257" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>AID.diff --staged</text>

  <rect x="732" y="274" width="182" height="58" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="740" y="290" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#e6edf3">breaks_compat:</text>
  <text x="906" y="290" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#37b47e">88.7%</text>
  <text x="740" y="306" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#e6edf3">changes_behavior:</text>
  <text x="906" y="306" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#37b47e">97.0%</text>
  <text x="740" y="322" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#e6edf3">security_sens:</text>
  <text x="906" y="322" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#37b47e">3.7%</text>

  <text x="734" y="348" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" fill="#8b949e">OpenAI · Gemini · TypeSafe</text>
  <text x="734" y="362" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" fill="#8b949e">OpenRouter · LiteLLM (0 out tok)</text>

  <!-- Converge wires to bottom outcome badge -->
  <line x1="609" y1="378" x2="609" y2="394" stroke="#37b47e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="823" y1="378" x2="823" y2="394" stroke="#37b47e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Bottom outcome badge (With) -->
  <rect x="508" y="398" width="416" height="44" rx="7" fill="#102920" stroke="#215c43" stroke-width="1"/>
  <text x="716" y="417" text-anchor="middle" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#37b47e">READY-TO-ACT STRUCTURED ANSWER IN ONE PASS</text>
  <text x="716" y="433" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#8b949e">Agent or human gets compact JSON &amp; calibrated [0, 1] probabilities</text>
  </g>
</svg>
