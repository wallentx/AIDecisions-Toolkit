<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-label="Comparison between ad-hoc LLM API calls and AIDecisions-Toolkit">
  <defs>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cf3f3f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f6fd6"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e8a5c"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="476" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <!-- ================= LEFT PANEL: WITHOUT AID ================= -->
  <rect x="18" y="18" width="452" height="440" rx="10" fill="#ffffff" stroke="#efb1b1" stroke-width="1.25"/>
  <rect x="18" y="18" width="452" height="42" rx="10" fill="#fcebeb"/>
  <rect x="18" y="48" width="452" height="12" fill="#fcebeb"/>
  <line x1="18" y1="60" x2="470" y2="60" stroke="#efb1b1" stroke-width="1"/>

  <circle cx="38" cy="39" r="5.5" fill="#cf3f3f"/>
  <text x="52" y="43" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="12" font-weight="700" fill="#cf3f3f">WITHOUT AID</text>
  <text x="454" y="43" text-anchor="end" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#59636e">Improvised multi-call agent loop</text>

  <!-- User prompt box (Left) -->
  <rect x="36" y="76" width="416" height="44" rx="7" fill="#f0f4f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="94" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="600" fill="#59636e">USER ASK</text>
  <text x="50" y="111" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#1f2328">&quot;Is PR #42 ready, and does my staged diff break the API?&quot;</text>

  <line x1="244" y1="120" x2="244" y2="140" stroke="#cf3f3f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow-bad)"/>

  <!-- Noisy command stack -->
  <rect x="36" y="144" width="416" height="28" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="48" y="162" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh pr view 42 --json files,reviews,statusCheckRollup</text>

  <rect x="36" y="178" width="416" height="28" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="48" y="196" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh api .../pulls/42/comments --paginate</text>

  <rect x="36" y="212" width="416" height="28" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="48" y="230" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh api graphql -f query=&apos;...reviewThreads...&apos;</text>

  <rect x="36" y="246" width="416" height="28" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="48" y="264" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>gh run view 918273 --log-failed</text>
  <text x="440" y="264" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10" fill="#8b9eb0"># megabytes</text>

  <rect x="36" y="280" width="416" height="28" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="48" y="298" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>git diff --cached</text>
  <text x="440" y="298" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10" fill="#8b9eb0"># raw prompt text</text>

  <line x1="244" y1="308" x2="244" y2="328" stroke="#cf3f3f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow-bad)"/>

  <!-- Context bloat box -->
  <rect x="36" y="332" width="416" height="52" rx="7" fill="#f0f4f8" stroke="#efb1b1" stroke-width="1"/>
  <text x="50" y="352" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1f2328">Agent parses raw responses across extra LLM turns</text>
  <text x="50" y="371" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#59636e">Unbounded JSON &amp; logs crowd context; prose guesses replace probabilities</text>

  <!-- Bottom cost badge (Left) -->
  <rect x="36" y="398" width="416" height="44" rx="7" fill="#fcebeb" stroke="#efb1b1" stroke-width="1"/>
  <text x="244" y="417" text-anchor="middle" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#cf3f3f">8-12 SHELL &amp; API CALLS  ·  HIGH CONTEXT BURN</text>
  <text x="244" y="433" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#59636e">Repeated parsing work, missed pages, and uncalibrated text judgment</text>


  <!-- ================= RIGHT PANEL: WITH AID ================= -->
  <rect x="490" y="18" width="452" height="440" rx="10" fill="#ffffff" stroke="#8fd4b5" stroke-width="1.25"/>
  <rect x="490" y="18" width="452" height="42" rx="10" fill="#e6f6ef"/>
  <rect x="490" y="48" width="452" height="12" fill="#e6f6ef"/>
  <line x1="490" y1="60" x2="942" y2="60" stroke="#8fd4b5" stroke-width="1"/>

  <circle cx="510" cy="39" r="5.5" fill="#1e8a5c"/>
  <text x="524" y="43" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="12" font-weight="700" fill="#1e8a5c">WITH AIDECISIONS-TOOLKIT</text>
  <text x="926" y="43" text-anchor="end" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#59636e">Agent skills + single-pass Decisions</text>

  <!-- User prompt box (Right) -->
  <rect x="508" y="76" width="416" height="44" rx="7" fill="#f0f4f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="522" y="94" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="600" fill="#59636e">SAME USER ASK</text>
  <text x="522" y="111" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#1f2328">&quot;Is PR #42 ready, and does my staged diff break the API?&quot;</text>

  <line x1="716" y1="120" x2="716" y2="138" stroke="#1f6fd6" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Installed Agent Skills + MCP routing bar (single flowed <text> with <tspan>s) -->
  <rect x="508" y="142" width="416" height="46" rx="7" fill="#e8f1fc" stroke="#9ec2f3" stroke-width="1"/>
  <text x="522" y="161" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#1f2328"><tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#1f6fd6">AID --init</tspan> installs <tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#c76a1d">SKILL.md</tspan> + <tspan font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#1f6fd6">AID --mcp</tspan> into your agent</text>
  <text x="522" y="179" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#59636e">Claude Code · Codex · Cursor · Gemini CLI · Antigravity · OpenCode · Copilot</text>

  <!-- Split wires to the 2 bounded operations -->
  <line x1="609" y1="188" x2="609" y2="208" stroke="#1f6fd6" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="823" y1="188" x2="823" y2="208" stroke="#1f6fd6" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Sub-card 1: Bounded Evidence Collectors -->
  <rect x="508" y="212" width="202" height="166" rx="7" fill="#f0f4f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="231" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700" fill="#1f6fd6">1. BOUNDED EVIDENCE</text>

  <rect x="518" y="240" width="182" height="26" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="527" y="257" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>AID.pr .../pull/42 --json</text>

  <text x="520" y="284" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#1f2328">• Paginated threads &amp; checks</text>
  <text x="520" y="301" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#1f2328">• Head-drift &amp; completeness</text>
  <text x="520" y="318" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#1f2328">• Strict byte caps enforced</text>
  <text x="520" y="340" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#59636e">Also: AID.pr-delta, AID.ci,</text>
  <text x="520" y="354" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#59636e">AID.review-queue, AID.runtime</text>

  <!-- Sub-card 2: Single-Pass Decisions API -->
  <rect x="722" y="212" width="202" height="166" rx="7" fill="#f0f4f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="734" y="231" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700" fill="#1e8a5c">2. DECISIONS API</text>

  <rect x="732" y="240" width="182" height="26" rx="5" fill="#11161c" stroke="#2b3440" stroke-width="1"/>
  <text x="741" y="257" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#d5e3ee"><tspan font-weight="700" fill="#37b47e">$ </tspan>AID.diff --staged</text>

  <rect x="732" y="274" width="182" height="58" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="740" y="290" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#1f2328">breaks_compat:</text>
  <text x="906" y="290" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#1e8a5c">88.7%</text>
  <text x="740" y="306" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#1f2328">changes_behavior:</text>
  <text x="906" y="306" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#1e8a5c">97.0%</text>
  <text x="740" y="322" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" fill="#1f2328">security_sens:</text>
  <text x="906" y="322" text-anchor="end" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" font-weight="700" fill="#1e8a5c">3.7%</text>

  <text x="734" y="348" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" fill="#59636e">OpenAI · Gemini · TypeSafe</text>
  <text x="734" y="362" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" fill="#59636e">OpenRouter · LiteLLM (0 out tok)</text>

  <!-- Converge wires to bottom outcome badge -->
  <line x1="609" y1="378" x2="609" y2="394" stroke="#1e8a5c" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="823" y1="378" x2="823" y2="394" stroke="#1e8a5c" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Bottom outcome badge (Right) -->
  <rect x="508" y="398" width="416" height="44" rx="7" fill="#e6f6ef" stroke="#8fd4b5" stroke-width="1"/>
  <text x="716" y="417" text-anchor="middle" font-family='ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace' font-size="11" font-weight="700" fill="#1e8a5c">READY-TO-ACT STRUCTURED ANSWER IN ONE PASS</text>
  <text x="716" y="433" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" fill="#59636e">Agent or human gets compact JSON &amp; calibrated [0, 1] probabilities</text>
</svg>
