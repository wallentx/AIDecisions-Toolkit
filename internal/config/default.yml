version: 1

global:
  provider: openai
  # Provider env vars (OPENAI_API_KEY, TYPESAFE_API_KEY, GEMINI_API_KEY, LITELLM_API_KEY)
  # take precedence over key files. Store a file path here, never a key.
  api_key_file: ""
  model: gpt-6-luna
  timeout_seconds: 30
  output: auto  # JSON for agents/pipes, readable text in a terminal

providers:
  openai:
    api_key_file: ""
  typesafe:
    api_key_file: ""
  gemini:
    api_key_file: ""
  litellm:
    api_key_file: ""
    endpoint: ""
    model: ""

updates:
  repository: "wallentx/AIDecisions-Toolkit"  # GitHub release source
  install_dir: ""  # Empty means the directory containing AID

tools:
  diff:
    checks_file: ""  # Optional JSON mapping check names to questions
    context: ""
  discover:
    provider: codex
    timeout_seconds: 120
    cache_ttl_seconds: 600
    page_size: 12
    min_sessions: 2
    max_output_bytes: 32768
  pr:
    gh: gh
    hostname: github.com
    timeout_seconds: 120
    max_output_bytes: 131072
    text_limit: 4000
  pr-delta:
    gh: gh
    hostname: github.com
    timeout_seconds: 120
    max_output_bytes: 131072
    text_limit: 280
  review-queue:
    gh: gh
    hostname: github.com
    owners: []  # Empty infers owners from the workspace's git remotes
    timeout_seconds: 120
    max_prs: 25
    max_output_bytes: 65536
  ci:
    gh: gh
    hostname: github.com
    timeout_seconds: 120
    max_output_bytes: 131072
    max_log_bytes: 2097152
  runtime:
    timeout_seconds: 120
    max_file_bytes: 536870912
